services:
  - type: web
    name: verity-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/recognition/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: VERITY_SIAMESE_MATCH_THRESHOLD
        value: "0.5"
